<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TypeSafe AI 文件</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/introduction" aria-label="TypeSafe AI 首頁"><span class="brand-mark">✳</span><span>TypeSafe <i>AI</i></span></a>
      <button class="search-trigger" id="searchTrigger" aria-label="開啟搜尋"><span>⌕</span> 搜尋文件 <kbd>⌘ K</kbd></button>
      <div class="top-actions"><button id="menuToggle" aria-label="開啟導覽" aria-expanded="false" aria-controls="sidebar">☰</button><a href="https://typesafe.ai" target="_blank" rel="noopener noreferrer">TypeSafe console ↗</a><button id="themeToggle" aria-label="切換主題" aria-pressed="false">◐</button></div>

    <aside class="sidebar" id="sidebar" aria-label="文件導覽"></aside>
    <main class="content" id="content"></main>
  </div>
  <div class="search-modal" id="searchModal" hidden><div class="search-card" role="dialog" aria-modal="true" aria-label="搜尋文件"><input id="searchInput" placeholder="搜尋文件…" /><button id="closeSearch">Esc</button><div id="searchResults" aria-live="polite"></div></div></div>
  <script src="./app.js"></script>
